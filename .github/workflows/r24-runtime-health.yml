name: R24 PC Executor runtime health

on:
  push:
    branches:
      - agent/pc-executor-r24-runtime-health-20261001
    paths:
      - "src/pc_executor/**"
      - "schemas/pc_executor.runtime_health.v1.schema.json"
      - "tests/test_runtime_health_r24.py"
      - "tests/test_runtime_health_fixture_pack.py"
      - "tests/windows/test_r24_runtime_health_windows.py"
      - "tests/fixtures/runtime_health_v1/**"
      - "docs/R24_RUNTIME_HEALTH.md"
      - ".github/workflows/r24-runtime-health.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r24-runtime-health:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Exact base and isolated R24 delta
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          base = "7eed906976d092e3216f50b0f52e6cb422392979"
          head = subprocess.check_output(["git","rev-parse","HEAD"], text=True).strip()
          branch = subprocess.check_output(["git","branch","--show-current"], text=True).strip()
          assert head != base
          assert branch == "agent/pc-executor-r24-runtime-health-20261001", branch
          assert subprocess.run(["git","merge-base","--is-ancestor",base,head]).returncode == 0
          changed = set(subprocess.check_output(
              ["git","diff","--name-only",base,head], text=True
          ).splitlines())
          allowed = {
              ".github/workflows/r24-runtime-health.yml",
              "docs/R24_RUNTIME_HEALTH.md",
              "schemas/pc_executor.runtime_health.v1.schema.json",
              "src/pc_executor/cancellation.py",
              "src/pc_executor/executor.py",
              "src/pc_executor/outcome_journal.py",
              "src/pc_executor/runtime_health.py",
              "src/pc_executor/uia.py",
              "tests/fixtures/runtime_health_v1/manifest.json",
              "tests/fixtures/runtime_health_v1/runtime_health.example.json",
              "tests/test_runtime_health_fixture_pack.py",
              "tests/test_runtime_health_r24.py",
              "tests/windows/test_r24_runtime_health_windows.py",
          }
          assert changed <= allowed, f"unexpected R24 files: {sorted(changed-allowed)}"
          assert changed, "R24 branch must be nonempty"
          assert subprocess.run(["git","diff","--check",base,head]).returncode == 0
          print("R24 exact-base/delta PASS", head, len(changed))
          PY
      - name: Pinned R22 producer audit remains green
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/r22-base" 7eed906976d092e3216f50b0f52e6cb422392979
          (
            cd "$RUNNER_TEMP/r22-base"
            python tools/audit_native_core_final_candidate.py
          )
          git worktree remove "$RUNNER_TEMP/r22-base"
      - name: R24 focused runtime health and UIA bounding
        run: python -m pytest tests/test_runtime_health_r24.py tests/test_runtime_health_fixture_pack.py tests/test_runtime_hardening.py tests/test_windows_uia_adapter.py tests/test_outcome_journal.py -v -s
      - name: Windows-safe R24 UIA producer evidence
        if: runner.os == 'Windows'
        run: python -m pytest tests/windows/test_r24_runtime_health_windows.py -v
      - name: R22 registry/parity invariants
        run: python -m pytest tests/test_native_core_registry_policy.py tests/test_native_tool_parity.py tests/test_native_remote_executor_adapter.py tests/test_native_remote_executor_adapter_recovery.py
      - name: Search/process relevant suites
        run: python -m pytest tests/test_search_sessions.py tests/test_pc_operations.py
      - name: Native schema reproducibility
        shell: bash
        run: |
          python tools/generate_native_tool_schemas.py
          git diff --exit-code -- schemas/
      - name: Full PC suite
        run: python -m pytest
