name: pc-relay-hardening

on:
  push:
    branches:
      - agent/pc-relay-hardening
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  relay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Relay fault matrix
        run: python -m pytest tests/test_pc_relay.py
      - name: Migration safety suite
        run: python -m pytest tests/test_pc_relay_migration.py
      - name: Structured operations suite
        run: python -m pytest tests/test_pc_operations.py
      - name: Full pc-executor suite
        run: python -m pytest

  evidence:
    if: always()
    needs: relay
    runs-on: ubuntu-latest
    steps:
      - name: Publish exact-head CI status
        uses: actions/github-script@v7
        with:
          script: |
            const ok = "${{ needs.relay.result }}" === "success";
            const state = ok ? "success" : "failure";
            const description = `run ${context.runId}: ${ok ? "SUCCESS" : "FAILURE"}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "pc-relay-hardening/exact-head",
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
