name: pc-relay-hardening

on:
  push:
    branches:
      - agent/pc-relay-hardening
  workflow_dispatch:

jobs:
  relay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Relay fault matrix
        run: python -m pytest tests/test_pc_relay.py
      - name: Full pc-executor suite
        run: python -m pytest
