name: PC relay stale-sync watchdog

on:
  push:
    branches:
      - agent/pc-relay-stale-sync-watchdog-20261001
    paths:
      - "tools/github_relay.py"
      - "tools/start_pc_control_relay.ps1"
      - "tests/test_github_relay.py"
      - "tests/test_relay_stale_sync_watchdog.py"
      - "conformance/pc_relay.health.v1/**"
      - "conformance/pc_relay.watchdog_status.v1/**"
      - "docs/PC_RELAY_STALE_SYNC_INCIDENT_2026-10-01.md"
      - "docs/PC_RELAY_STALE_SYNC_WATCHDOG.md"
      - ".github/workflows/stale-sync-watchdog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale-sync-watchdog:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"

      - name: Exact base and isolated watchdog delta
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          base = "85877d46e2d51f5d0b1c1b35abc23f032bfedbee"
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          branch = subprocess.check_output(["git", "branch", "--show-current"], text=True).strip()
          assert head != base
          assert branch == "agent/pc-relay-stale-sync-watchdog-20261001", branch
          assert subprocess.run(["git", "merge-base", "--is-ancestor", base, head]).returncode == 0
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", base, head],
                  text=True,
              ).splitlines()
          )
          allowed = {
              ".github/workflows/tests.yml",
              ".github/workflows/stale-sync-watchdog.yml",
              "conformance/pc_relay.health.v1/manifest.json",
              "conformance/pc_relay.health.v1/producer-pin.r2.json",
              "conformance/pc_relay.health.v1/schema.json",
              "conformance/pc_relay.watchdog_status.v1/compatibility-report.md",
              "conformance/pc_relay.watchdog_status.v1/manifest.json",
              "conformance/pc_relay.watchdog_status.v1/schema.json",
              "docs/PC_RELAY_STALE_SYNC_WATCHDOG.md",
              "tests/test_github_relay.py",
              "tests/test_relay_stale_sync_watchdog.py",
              "tools/github_relay.py",
              "tools/start_pc_control_relay.ps1",
          }
          assert changed <= allowed, f"unexpected files: {sorted(changed - allowed)}"
          assert subprocess.run(["git", "diff", "--check", base, head]).returncode == 0
          print("STALE_SYNC_EXACT_BASE_PASS", head, len(changed))
          PY

      - name: Compile watchdog source
        run: python -m compileall -q tools/github_relay.py

      - name: Focused stale-sync watchdog regressions
        run: python -m pytest tests/test_github_relay.py tests/test_relay_stale_sync_watchdog.py -v -s

      - name: Windows launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $text = Get-Content -LiteralPath tools/start_pc_control_relay.ps1 -Raw
          [scriptblock]::Create($text) | Out-Null
          Write-Host "STALE_SYNC_LAUNCHER_SYNTAX_PASS"

      - name: Full repository suite
        run: python -m pytest
