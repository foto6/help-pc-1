name: R27 relay exact progress evidence delivery

on:
  push:
    branches:
      - agent/pc-relay-r27-evidence-delivery-20261001
    paths:
      - "src/pc_relay/evidence.py"
      - "tools/read_relay_progress_evidence.py"
      - "schemas/pc_relay.progress_evidence.v1.schema.json"
      - "tests/test_relay_evidence_r27.py"
      - "tests/fixtures/relay_progress_evidence_v1/**"
      - "conformance/pc_relay.progress_evidence.v1/**"
      - "docs/R27_RELAY_EVIDENCE_DELIVERY.md"
      - ".github/workflows/r27-relay-evidence-delivery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r27-evidence-delivery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"

      - name: Exact R27 base and isolated delta
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          base = "96d453bcdc866bfd26c06ad88e2ec0c033fbccdd"
          head = subprocess.check_output(["git","rev-parse","HEAD"], text=True).strip()
          branch = subprocess.check_output(["git","branch","--show-current"], text=True).strip()
          assert head != base
          assert branch == "agent/pc-relay-r27-evidence-delivery-20261001", branch
          assert subprocess.run(["git","merge-base","--is-ancestor",base,head]).returncode == 0
          changed = set(subprocess.check_output(
              ["git","diff","--name-only",base,head], text=True
          ).splitlines())
          allowed = {
              ".github/workflows/r27-relay-evidence-delivery.yml",
              "conformance/pc_relay.progress_evidence.v1/binding-report.md",
              "conformance/pc_relay.progress_evidence.v1/manifest.json",
              "docs/R27_RELAY_EVIDENCE_DELIVERY.md",
              "schemas/pc_relay.progress_evidence.v1.schema.json",
              "src/pc_relay/evidence.py",
              "tests/fixtures/relay_progress_evidence_v1/evidence.example.json",
              "tests/test_relay_evidence_r27.py",
              "tools/read_relay_progress_evidence.py",
          }
          assert changed <= allowed, f"unexpected R27 files: {sorted(changed-allowed)}"
          assert changed, "R27 branch must be nonempty"
          assert subprocess.run(["git","diff","--check",base,head]).returncode == 0
          print("R27 exact-base/delta PASS", head, len(changed))
          PY

      - name: Frozen R26 producer files remain byte-identical
        shell: bash
        run: |
          git diff --exit-code 96d453bcdc866bfd26c06ad88e2ec0c033fbccdd HEAD -- \
            src/pc_relay/progress.py \
            tools/github_relay.py \
            tools/start_pc_control_relay.ps1 \
            schemas/pc_relay.progress.v1.schema.json \
            schemas/pc_relay.liveness_probe.v1.schema.json \
            tests/fixtures/relay_progress_v1/manifest.json \
            tests/fixtures/relay_progress_v1/progress.example.json

      - name: Compile delivery source
        run: python -m compileall -q src/pc_relay/evidence.py tools/read_relay_progress_evidence.py

      - name: R27 focused atomic evidence delivery suite
        run: python -m pytest tests/test_relay_evidence_r27.py -v -s

      - name: R26 relay semantics regression
        run: python -m pytest tests/test_github_relay.py tests/test_relay_progress_r26.py -v

      - name: Full repository suite
        run: python -m pytest
