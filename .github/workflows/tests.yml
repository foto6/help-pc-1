name: pc-executor-tests

on:
  push:
    branches:
      - agent/pc-executor
      - agent/pc-native-integration-canonical
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Wave 6 focused preflight suite
        run: python -m pytest tests/test_preflight.py
      - name: Wave 7 focused context-binding suite
        run: python -m pytest tests/test_execution_context_binding.py
      - name: Native remote transport focused suite
        run: python -m pytest tests/test_native_remote_transport.py tests/test_remote_protocol.py
      - name: Native remote transport harness
        run: python tools/native_remote_harness.py
      - name: Full test suite
        run: python -m pytest
