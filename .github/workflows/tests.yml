name: pc-executor-tests

on:
  push:
    branches:
      - agent/pc-executor
      - agent/pc-native-tool-parity
      - agent/pc-native-full-stack
      - agent/pc-native-full-parity-gaps
      - agent/pc-native-core-final-candidate
      - agent/pc-r16-executor-chaos-contracts-20260928
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Final PC Core provenance and registry audit (immutable pinned producer)
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/r16-pinned-core" 04f817299b46ecb0ffa8aa908ce84fdb4c3300d0
          (
            cd "$RUNNER_TEMP/r16-pinned-core"
            python tools/audit_native_core_final_candidate.py
          )
          git worktree remove "$RUNNER_TEMP/r16-pinned-core"
      - name: R16 validation-only exact-base delta audit
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          base = "04f817299b46ecb0ffa8aa908ce84fdb4c3300d0"
          actual = set(subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD"], text=True
          ).splitlines())
          expected = {
              ".github/workflows/tests.yml",
              "docs/R16_EXECUTOR_CHAOS_CONTRACTS.md",
              "tests/fixtures/r16_executor_chaos/matrix.v1.json",
              "tests/test_r16_executor_chaos_contracts.py",
          }
          assert actual == expected, (
              f"R16 validation-only delta mismatch: missing={sorted(expected-actual)} "
              f"extra={sorted(actual-expected)}"
          )
          PY
      - name: Wave 6 focused preflight suite
        run: python -m pytest tests/test_preflight.py
      - name: Wave 7 focused context-binding suite
        run: python -m pytest tests/test_execution_context_binding.py
      - name: Native desktop parity focused suite
        run: python -m pytest tests/test_pc_operations.py tests/test_native_tool_parity.py tests/test_native_full_parity_gaps.py
      - name: Stateful search focused suite
        run: python -m pytest tests/test_search_sessions.py
      - name: Windows device service focused suite
        run: python -m pytest tests/test_native_device_service.py
      - name: Native service immutable-artifact security suite
        run: python -m pytest tests/test_native_service_artifact.py
      - name: R16 Executor synthetic chaos conformance
        run: python -m pytest tests/test_r16_executor_chaos_contracts.py -v
      - name: Registry policy and direct parity suite
        run: python -m pytest tests/test_native_core_registry_policy.py tests/test_native_stack_integration.py
      - name: Native schema reproducibility
        shell: bash
        run: |
          python tools/generate_native_tool_schemas.py
          git diff --exit-code -- schemas/
      - name: Windows native adapter suite
        if: runner.os == 'Windows'
        run: python -m pytest tests/windows/test_native_windows_ops.py tests/windows/test_search_sessions_windows.py
      - name: Native remote transport focused suite
        run: python -m pytest tests/test_native_remote_transport.py tests/test_remote_protocol.py
      - name: Native remote transport harness
        run: python tools/native_remote_harness.py
      - name: Native remote Executor adapter suite
        run: python -m pytest tests/test_native_remote_executor_adapter.py tests/test_native_remote_executor_adapter_recovery.py
      - name: Native full-stack real Executor integration suite
        run: python -m pytest tests/test_native_full_stack_integration.py
      - name: Full test suite
        run: python -m pytest
